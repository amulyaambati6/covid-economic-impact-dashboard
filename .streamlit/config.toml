# Editorial light theme: warm ivory, blush accents, dark navy text.
# Fixed light so the app looks the same on every laptop and on a projector.
# Fonts load from Google Fonts; without internet Streamlit falls back to the
# serif / sans-serif fonts listed after the comma.
[theme]
base = "light"
primaryColor = "#A8445F"
backgroundColor = "#FBF7F1"
secondaryBackgroundColor = "#F5EAE5"
textColor = "#1C2B44"
linkColor = "#A8445F"
borderColor = "#E8DCD4"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500;1,8..60,600&display=swap, Georgia, serif"
headingFontWeights = [650, 600, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#F5EAE5"
secondaryBackgroundColor = "#FFFDF9"

[client]
# Hide the Deploy button and developer menu during presentations.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
